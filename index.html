:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #14212b; --muted: #5a6b78;
  --line: #d3dbe0; --accent: #1d3b4f; --accent-ink: #ffffff; --rec: #c8372d;
  --ok: #2b7a4b; --highlight: #f8ecd4;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171d; --surface: #18232b; --ink: #e7edf1; --muted: #93a4b1;
    --line: #2a3943; --accent: #8fc3de; --accent-ink: #0f171d; --rec: #ff6a5e;
    --ok: #6fcf97; --highlight: #3a3220;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 1.5rem; margin: 8px 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; margin-bottom: 14px;
}
.row { display: flex; gap: 10px; }
.row > label { flex: 1; min-width: 0; }
label { display: block; font-size: .85rem; color: var(--muted); }
select {
  width: 100%; margin-top: 4px; padding: 10px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.opt { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink); font-size: .9rem; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
button, .filebtn {
  font: inherit; font-weight: 600; padding: 14px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  text-align: center; cursor: pointer; display: block;
}
button.primary, .filebtn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.recording { background: var(--rec); color: #fff; border-color: var(--rec); }
button:disabled, .filebtn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

.status { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: .92rem; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.dot.rec { background: var(--rec); animation: pulse .8s ease-in-out infinite; }
.dot.ok { background: var(--ok); }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

#result {
  width: 100%; min-height: 220px; resize: vertical; padding: 12px; font: inherit; line-height: 1.6;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
